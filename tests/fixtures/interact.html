<!doctype html>
<meta charset="utf-8">
<title>Interaction fixture</title>
<style>body{font:16px sans-serif;margin:20px}button,input,select,textarea{margin:5px}#hidden{display:none}#drag,#drop{padding:12px;border:1px solid #777;display:inline-block}</style>
<h1>Interaction fixture</h1>
<form id="myform">
<label for="name">User name</label><input id="name" data-testid="username" autocomplete="off">
<label for="secret">Secret</label><input id="secret" type="password" value="DO_NOT_DISCLOSE">
<label for="agree">Agree terms</label><input id="agree" type="checkbox">
<label for="color">Color</label><select id="color"><option value="r">Red</option><option value="g">Green</option></select>
<label for="bio">Biography</label><textarea id="bio"></textarea>
<input id="files" type="file" multiple aria-label="Attachments">
<button id="save" type="button">Save</button>
<button id="submit" type="submit">Submit form</button>
</form>
<button id="hidden">Hidden action</button>
<div id="result" aria-live="polite">ready</div>
<div id="delayed-host"></div>
<div id="shadow-host"></div>
<iframe id="same" title="same frame" src="interact-frame.html"></iframe>
<iframe id="cross" title="cross frame" src="http://localhost:9488/interact-frame.html"></iframe>
<div id="drag" draggable="true">Drag me</div><div id="drop">Drop here</div>
<a id="nav" href="interact-next.html">Next page</a>
<script>
const result=document.querySelector('#result');
document.querySelector('#save').onclick=()=>{window.clicks=(window.clicks||0)+1;result.textContent='saved '+window.clicks};
document.querySelector('#myform').onsubmit=e=>{e.preventDefault();result.textContent='submitted'};
document.querySelector('#files').onchange=e=>result.textContent='files '+e.target.files.length;
setTimeout(()=>{const b=document.createElement('button');b.id='delayed';b.textContent='Delayed';b.onclick=()=>result.textContent='delayed clicked';document.querySelector('#delayed-host').append(b)},150);
const shadow=document.querySelector('#shadow-host').attachShadow({mode:'open'});
shadow.innerHTML='<button id="shadow-save" aria-label="Shadow save">Shadow save</button>';
shadow.querySelector('button').onclick=()=>result.textContent='shadow clicked';
const drop=document.querySelector('#drop');drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();result.textContent='dropped'};
</script>
