<!doctype html><meta charset=utf-8><title>Login fixture</title>
<h1>Sign in</h1>
<form onsubmit="event.preventDefault();login()">
<label>Username <input id=user name=username autocomplete=username></label>
<label>Password <input id=pass name=password type=password autocomplete=current-password></label>
<button type=submit>Sign in</button>
</form>
<p id=msg></p>
<script>
function login(){
  var u=document.getElementById('user').value, p=document.getElementById('pass').value;
  if(p!=='hunter2'){document.getElementById('msg').textContent='Wrong password';return;}
  document.cookie='cuslim_session='+encodeURIComponent(u)+'; path=/; max-age=3600';
  location.href='account.html';
}
</script>
